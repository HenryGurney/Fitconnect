name: fitconnect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- FitConnect Core Matchmaking & Database Stack ---
  supabase_flutter: ^2.8.0
  flutter_card_swiper: ^7.2.0
  font_awesome_flutter: ^10.8.0
  image_picker: ^1.1.2
  purchases_flutter: ^8.0.0

  # --- Location & Geocoding Systems ---
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # --- Unified Interactive Mapping Components ---
  flutter_map: ^8.3.0
  google_maps_flutter: ^2.10.0
  flutter_typeahead: ^6.0.0
  http: ^1.6.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- Dynamic Native Splash Asset Pipeline ---
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/fitconnect.png

# --- Native Splash Configuration ---
flutter_native_splash:
  color: "#000000"
  image: assets/images/fitconnect.png

  android_12:
    color: "#000000"
    # FIX: Changed 'image' to 'icon_widget' to satisfy the native Android API wrapper
    icon_widget: assets/images/fitconnect.png
  
  fullscreen: true
  